<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Four levels of AI automation</title>
  <desc id="desc">Human involvement tapers from hands-on session work, through guidance and delegation, to setting the goal and reviewing the automated result.</desc>
  <defs><style>.label{font:700 16px system-ui,sans-serif;fill:#f5f8fb}.small{font:500 13px system-ui,sans-serif;fill:#dce7f0}.stage{fill:#23384c;stroke:#80cbc4;stroke-width:2}.node{fill:#b9e8e4;stroke:#10242c;stroke-width:2}.line{fill:none;stroke:#a8deda;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect x="8" y="8" width="944" height="284" rx="18" fill="#152438" stroke="#526a7e"/>
  <circle class="node" cx="86" cy="150" r="28"/><circle cx="86" cy="142" r="8" fill="#10242c"/><path d="M69 166c3-18 31-18 34 0" fill="none" stroke="#10242c" stroke-width="6" stroke-linecap="round"/>
  <text class="label" x="86" y="205" text-anchor="middle">Human</text><text class="small" x="86" y="226" text-anchor="middle">sets the goal</text>
  <path class="line" d="M114 150h60M320 150h28M494 150h28M668 150h28M842 150h14"/>
  <g><rect class="stage" x="174" y="72" width="146" height="156" rx="14"/><text class="small" x="247" y="105" text-anchor="middle">1</text><text class="label" x="247" y="137" text-anchor="middle">Sessions</text><text class="small" x="247" y="163" text-anchor="middle">person in the loop</text><rect x="214" y="184" width="66" height="7" rx="3" fill="#80cbc4"/></g>
  <g><rect class="stage" x="348" y="72" width="146" height="156" rx="14"/><text class="small" x="421" y="105" text-anchor="middle">2</text><text class="label" x="421" y="137" text-anchor="middle">Team</text><text class="small" x="421" y="163" text-anchor="middle">guide the team</text><circle cx="397" cy="190" r="7" fill="#80cbc4"/><circle cx="421" cy="190" r="7" fill="#f5c16c"/><circle cx="445" cy="190" r="7" fill="#e6a08e"/></g>
  <g><rect class="stage" x="522" y="72" width="146" height="156" rx="14"/><text class="small" x="595" y="105" text-anchor="middle">3</text><text class="label" x="595" y="137" text-anchor="middle">Delegate</text><text class="small" x="595" y="163" text-anchor="middle">step away</text><path d="M564 190h62m-50-10 10 10-10 10m36-20-10 10 10 10" fill="none" stroke="#80cbc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g><rect class="stage" x="696" y="72" width="146" height="156" rx="14"/><text class="small" x="769" y="105" text-anchor="middle">4</text><text class="label" x="769" y="137" text-anchor="middle">Automate</text><text class="small" x="769" y="163" text-anchor="middle">goal + review</text><path d="M741 185h56v17h-56zm0-10h56m-40 0v10m24-10v10" fill="none" stroke="#80cbc4" stroke-width="3" stroke-linejoin="round"/></g>
  <circle class="node" cx="884" cy="150" r="28"/><circle cx="884" cy="142" r="8" fill="#10242c"/><path d="M867 166c3-18 31-18 34 0" fill="none" stroke="#10242c" stroke-width="6" stroke-linecap="round"/>
  <text class="label" x="884" y="205" text-anchor="middle">Human</text><text class="small" x="884" y="226" text-anchor="middle">reviews result</text>
</svg>
