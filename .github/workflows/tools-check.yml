name: tools-check

# Validates the static /tools/ pages (scripts/tools/**). No secrets,
# read-only token, no deploy.
on:
  pull_request:
    paths: ["skills/**", "tests/skills/**", "tools/**", "scripts/tools/**", "package.json", "homepage/index.html", "tests/tools/**", ".github/workflows/tools-check.yml"]
  push:
    branches: [main]
    paths: ["skills/**", "tests/skills/**", "tools/**", "scripts/tools/**", "package.json", "homepage/index.html", "tests/tools/**", ".github/workflows/tools-check.yml"]

permissions:
  contents: read

concurrency:
  group: tools-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: install published DSL compiler
        run: npm i -g @lmctl-ai/lmctl@0.2.347
      - name: check tools pages
        run: npm run check:tools
      - name: checker self-test
        run: npm run check:tools:selftest
      - name: check generated skills and invariants
        run: npm run check:skills
      - name: skills self-test
        run: npm run check:skills:selftest
