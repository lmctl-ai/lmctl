<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Four rising levels of agent automation</title>
  <desc id="desc">A staircase rises from naming sessions to automating a workflow. Your role moves from every turn to briefing the team and reviewing its result.</desc>
  <defs><style>
    .label{font:700 20px system-ui,sans-serif;fill:#f5f8fb}.small{font:600 16px system-ui,sans-serif;fill:#dce7f0}.stage{fill:#31475c;fill-opacity:.88;stroke:#6fbdb4;stroke-width:2}.human{fill:#f5c16c;stroke:#152438;stroke-width:3}.line{fill:none;stroke:#f5c16c;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <rect x="7" y="7" width="946" height="346" rx="20" fill="#152438" stroke="#526a7e"/>
  <path class="line" d="M70 258H108V250H270M270 250H285V223H300M460 223H475V190H490M650 190H665V160H680M840 160H860V52H891"/>
  <circle class="human" cx="51" cy="258" r="19"/><circle cx="51" cy="253" r="5" fill="#152438"/><path d="M41 270c2-9 18-9 20 0" fill="none" stroke="#152438" stroke-width="4" stroke-linecap="round"/>
  <text class="small" x="50" y="294" text-anchor="middle">You start</text>
  <g><rect class="stage" x="110" y="185" width="160" height="130" rx="13"/><text class="small" x="127" y="211">LEVEL 1</text><text class="label" x="190" y="241" text-anchor="middle">Know sessions</text><text class="small" x="190" y="268" text-anchor="middle">You: every turn</text><path d="M162 291h56m-56 8h34" stroke="#f5c16c" stroke-width="5" stroke-linecap="round"/></g>
  <g><rect class="stage" x="300" y="150" width="160" height="130" rx="13"/><text class="small" x="317" y="176">LEVEL 2</text><text class="label" x="380" y="206" text-anchor="middle">Coordinate</text><text class="small" x="380" y="233" text-anchor="middle">You: in the loop</text><circle cx="354" cy="257" r="6" fill="#89d5cb"/><circle cx="380" cy="257" r="6" fill="#f5c16c"/><circle cx="406" cy="257" r="6" fill="#8aa8ed"/></g>
  <g><rect class="stage" x="490" y="115" width="160" height="150" rx="13"/><text class="small" x="507" y="141">LEVEL 3</text><text class="label" x="570" y="171" text-anchor="middle">Delegate</text><text class="small" x="570" y="198" text-anchor="middle">You: start</text><text class="small" x="570" y="218" text-anchor="middle">and end</text><path d="M538 240h64m-12-9 12 9-12 9" fill="none" stroke="#f5c16c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g><rect class="stage" x="680" y="80" width="160" height="160" rx="13"/><text class="small" x="697" y="106">LEVEL 4</text><text class="label" x="760" y="136" text-anchor="middle">Automate</text><text class="small" x="760" y="163" text-anchor="middle">You: brainstorm</text><text class="small" x="760" y="183" text-anchor="middle">and verdict</text><path d="M728 220h64m-48-8v8m32-8v8" fill="none" stroke="#f5c16c" stroke-width="3" stroke-linecap="round"/></g>
  <circle class="human" cx="910" cy="52" r="19"/><circle cx="910" cy="47" r="5" fill="#152438"/><path d="M900 64c2-9 18-9 20 0" fill="none" stroke="#152438" stroke-width="4" stroke-linecap="round"/>
  <text class="small" x="914" y="94" text-anchor="middle">You review</text>
</svg>
