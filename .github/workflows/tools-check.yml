name: tools-check

# Validates the static /tools/ pages (scripts/check-tools.mjs). No secrets,
# read-only token, no deploy.
on:
  pull_request:
    paths: ["tools/**", "scripts/check-tools.mjs", "tests/tools/**", ".github/workflows/tools-check.yml"]
  push:
    branches: [main]
    paths: ["tools/**", "scripts/check-tools.mjs", "tests/tools/**", ".github/workflows/tools-check.yml"]

permissions:
  contents: read

concurrency:
  group: tools-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Zero-dependency script: no npm install needed.
      - name: check tools pages
        run: node scripts/check-tools.mjs
      - name: checker self-test
        run: node scripts/check-tools.mjs --selftest
