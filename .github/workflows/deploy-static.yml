name: deploy-static
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'skills/**'
      - 'skills-moved/**'
      - 'homepage/**'
      - 'scripts/homepage/video/**'
      - 'scripts/tools/homepage-videos.lms'
      - 'scripts/deploy*.sh'
      - 'scripts/tools/**'
      - 'helloexample/**'
      - 'lmscript-site/**'
      - 'scripts/lmscript-site/**'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: site-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15
      - name: Install published DSL compiler
        run: npm i -g @lmctl-ai/lmctl@0.2.369
      - name: Resolve lmhtml from the lmscript tool cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "LMHTML=$(bash scripts/tools/run.sh host-path)" >> "$GITHUB_ENV"
      - name: Check pages, memory and fixtures (release-installed hosts)
        run: |
          npm run check:tools
          npm run check:homepage
          python3 scripts/tools/test-live.py
          npm run check:skills
          npm run check:memory
          npm run check:tools:selftest
          npm run check:skills:selftest
          npm run check:memory:selftest
          npm run check:lmscript-site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Select changed static areas
        id: areas
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: echo "areas=$(python3 scripts/tools/static-site.py changed)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::254332045686:role/lmctl-website-deploy
          aws-region: us-east-1
      - name: Publish changed areas and wait for exact-path invalidations
        env:
          AREAS: ${{ steps.areas.outputs.areas }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for area in $AREAS; do
            bash "scripts/deploy-$area.sh"
          done
      - name: Verify live bytes, headers, links, images and anchors
        run: bash scripts/tools/verify-live.sh --repair-cdn
