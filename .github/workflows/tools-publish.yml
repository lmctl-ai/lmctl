name: tools-publish

# Publishes the static /tools/ tree to S3 + CloudFront when it actually changes.
#
# OWNER POLICY OVERRIDE (operator, 2026-11-22): the sibling tools-check.yml
# records "checks/publication run only on explicit dispatch". The operator asked
# for automatic publication on change, so this workflow carries a push trigger.
# That is a deliberate override of that line, not an oversight -- if the policy
# still stands, delete the `push:` block and this becomes dispatch-only again.
#
# COST: scripts/tools/static-site.py compares each expected object's content MD5
# against the LIVE object's ETag (plus ContentType and CacheControl) and uploads
# only the keys that differ, deriving CloudFront invalidation paths from that same
# set. So a run with no real change performs HEADs and zero PUTs and zero
# invalidations. Do NOT replace it with `aws s3 sync --delete` or a blind upload;
# the path filter keeps runs rare, and the ETag comparison keeps them cheap.
# Caveat worth knowing: invalidation paths come from changes + deletions + stale CDN
# responses, so a run can still invalidate with zero PUTs if CloudFront is serving
# something stale. That is correct behaviour, not a bug.

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'scripts/tools/**'
      - 'static/js/lmctl-copy.js'        # published AS tools/lmctl-copy.js (static-site.py:69)
      - 'scripts/deploy-tools.sh'
      - 'package.json'                   # the npm scripts this workflow invokes
      - 'build-inputs/lmvideo/**'        # staged book media inputs
      - '.github/workflows/tools-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # OIDC only; no stored AWS keys

concurrency:
  # SHARED with deploy-static.yml / deploy.yml: all three write the same bucket and
  # ownership manifest, so they must not overlap. cancel-in-progress stays false --
  # never abort a deploy that has started uploading.
  group: site-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
      S3_BUCKET: lmctl-website-prod
      CF_DISTRIBUTION_ID: E1GKUWTM93U7IV
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15
      - name: install published DSL compiler
        run: npm i -g @lmctl-ai/lmctl@staging
      - name: Stage locked website book media
        run: python3 scripts/tools/stage-book-media.py
      - name: Resolve lmhtml (PATH, else the release pinned in scripts/tools/lmhtml.lock)
        run: echo "LMHTML=$(bash scripts/tools/run.sh host-path)" >> "$GITHUB_ENV"

      # tools/index.html is GENERATED by scripts/tools/decorate.lms. Regenerate and
      # fail if the committed tree differs, so a generator edit cannot publish stale
      # output -- the exact drift that produced the /tools/<tool> link bug.
      - name: Regenerate the generated tree
        run: npm run decorate:tools
      # `git diff --quiet` exits 0 for an UNTRACKED generated file, so a newly
      # generated page would slip through. git status --porcelain reports modified,
      # deleted AND untracked.
      - name: Fail if the committed artefact drifted from its generator
        run: |
          drift="$(git status --porcelain -- tools/)"
          if [ -n "$drift" ]; then
            echo "::error::tools/ is out of date with scripts/tools/decorate.lms."
            echo "Run 'npm run decorate:tools' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi

      - name: check public example import policy
        run: npm run test:pull:tools
      - name: check tools pages
        run: npm run check:tools
      - name: checker self-test
        run: npm run check:tools:selftest

      - name: Assume the deploy role via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::254332045686:role/lmctl-website-deploy
          aws-region: us-east-1

      # No DRY_RUN preview step: it repeats the bucket inventory, the HEADs, the
      # manifest fetch and full live-object downloads before the real run does them
      # again. The real run logs every "upload <key>" line anyway.
      - name: Publish changed objects to S3 + invalidate
        run: bash scripts/deploy-tools.sh
